server:
  port: 8080                                     # 스프링 부트 서버 포트

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # localhost:3306 뒤의 my_database는 앞서 도커에서 설정한 MYSQL_DATABASE 이름과 같아야 합니다.
    url: jdbc:mysql://localhost:3307/my_database?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: my_user                            # 도커에서 설정한 MYSQL_USER
    password: user_password                      # 도커에서 설정한 MYSQL_PASSWORD

  jpa:
    hibernate:
      ddl-auto: update                           # 엔티티 클래스에 맞게 DB 테이블을 자동 생성/수정 (개발용)
    show-sql: true                               # 하이버네이트가 실행하는 SQL 쿼리를 콘솔에 출력
    properties:
      hibernate:
        format_sql: true                         # 콘솔에 출력되는 SQL 쿼리를 보기 좋게 정렬
        dialect: org.hibernate.dialect.MySQLDialect # MySQL 방언 설정