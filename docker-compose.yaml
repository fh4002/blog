services:
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password        # 루트(root) 계정 비밀번호
      MYSQL_DATABASE: my_database               # 자동 생성할 데이터베이스 이름 (선택 사항)
      MYSQL_USER: my_user                       # 자동 생성할 일반 사용자 계정 (선택 사항)
      MYSQL_PASSWORD: user_password             # 일반 사용자 계정 비밀번호 (선택 사항)
      TZ: Asia/Seoul                            # 타임존 설정 (한국 시간)
    ports:
      - "3307:3306"                             # 호스트 포트 : 컨테이너 포트
    volumes:
      - mysql_data:/var/lib/mysql               # 데이터베이스 데이터를 로컬에 영구 저장

volumes:
  mysql_data:                                   # 도커 볼륨 정의